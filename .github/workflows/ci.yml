name: CI

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SqlPerformanceLab.sln

      - name: Build
        run: >
          dotnet build SqlPerformanceLab.sln
          --configuration Release
          --no-restore

      - name: Run unit tests
        run: >
          dotnet test
          --solution SqlPerformanceLab.sln
          --configuration Release
          --no-build
          --minimum-expected-tests 1

  sqlserver-smoke:
    name: SQL Server Benchmark Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build benchmark runner
        run: docker compose build lab

      - name: Start SQL Server
        run: docker compose up -d sqlserver

      - name: Setup benchmark database
        run: docker compose run --rm --no-deps lab setup

      - name: Run all scenarios
        run: >
          docker compose run --rm --no-deps lab
          run
          --scenario all
          --iterations 1

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs sqlserver

      - name: Stop containers
        if: always()
        run: docker compose down -v
